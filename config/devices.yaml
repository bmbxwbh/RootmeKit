# RootmeKit 设备配置
# 支持两种输入:
#   ROM 链接 (.zip) — 完整流程: 下载 ROM → 解包分区 → 提取内核
#   Boot 镜像 (.img) — 精简流程: 下载镜像 → 提取内核
# 自动识别: 下载后根据实际文件后缀判断，无需手动指定
# 修改此文件后推送到 main 分支，GitHub Action 自动构建.

devices:
  # ROM 示例 - 填写完整 ROM 下载链接
  - url: "https://firmware-res.flyme.com/Firmware/Flyme/meizu21Pro/12.6.0.0/cn/20260128055916/f1f595db/update.zip?auth_key=1784096097-0-0-b58c55a4216062359fa9d98443fcef8c"

  # Boot 镜像示例 - 直接填写 boot.img 或 init_boot.img 链接
  # - url: "https://example.com/init_boot.img"

  # 可选字段:
  #   name: 设备名，默认从文件名自动生成
  #   kernel_partition: 内核所在分区 (留空自动检测)
  #     老手机 (Android 12 及更早): boot
  #     新手机 (Android 13+ GKI):     init_boot
  #     不填则自动尝试 init_boot -> boot -> vendor_boot
  #   manual_offsets: 自动提取失败时手动指定
#     KIMAGE_TEXT_BASE: "0xFFFFFFC080000000"
#     INIT_TASK_OFF: "0x0"
#   su_binary: "path/to/su"         # 内嵌 su 二进制路径
#   ksud_binary: "path/to/ksud"     # 内嵌 ksud 守护进程路径
#   wallpaper: "path/to/wallpaper.webp"  # 壁纸重载触发
